mesh: meshes/poiseuille.msh
output_dir: solucoes/poiseuille
benchmark_xlsx: solucoes/benchmarks.xlsx

simulation:
  dt: 0.001
  iterations: 1000
  reynolds: 1
  advection: eulerian  # eulerian (padrao) ou semi_lagrangian
  element: mini  # mini (padrao, hoje) ou tri6
  vtk_interval: 10  # grava 1 .vtk a cada N iteracoes (padrao 10); a ultima e' sempre gravada
  solver:  # BiCGSTAB -- bloco opcional, estes sao os defaults
    tol: 1.0e-8      # residuo relativo alvo por passo de tempo
    max_iter: 2000   # teto de iteracoes por passo (malha maior pode precisar de mais)

boundary:
  # Ordem de prioridade dos contornos, da mais baixa para a mais alta.
  # Quando um nó pertence a mais de um contorno (ex.: quinas da malha),
  # vale a condição do último nome desta lista que o contém.
  priority: [outlet, inlet, top, bottom]
  conditions:
    inlet:  {vx: 1.0, vy: 0.0}
    bottom: {vx: 0.0, vy: 0.0}
    top:    {vx: 0.0, vy: 0.0}
    outlet: {p: 0.0} #Velocidade solta para que o códigogere a solução.

# Deslocamento senoidal de um nó da malha (experimento de malha móvel).
moving_point:
  enabled: false
  node_index: 345
  amplitude_factor: 0.1
  omega: 628.3185307179587  # pi * 200
