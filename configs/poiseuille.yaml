mesh: meshes/poiseuille.msh
output_dir: solucoes

simulation:
  dt: 0.001
  iterations: 1000
  reynolds: 1

boundary:
  # Ordem de prioridade dos contornos, da mais baixa para a mais alta.
  # Quando um nó pertence a mais de um contorno (ex.: quinas da malha),
  # vale a condição do último nome desta lista que o contém.
  priority: [outlet, inlet, top, bottom]
  conditions:
    inlet:  {vx: 1.0, vy: 0.0}
    bottom: {vx: 0.0, vy: 0.0}
    top:    {vx: 0.0, vy: 0.0}
    outlet: {p: 0.0}

# Deslocamento senoidal de um nó da malha (experimento de malha móvel).
moving_point:
  enabled: true
  node_index: 345
  amplitude_factor: 0.1
  omega: 628.3185307179587  # pi * 200
