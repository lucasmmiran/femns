[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femns"
version = "0.1.0"
description = "Solver de elementos finitos (Galerkin) para Navier-Stokes em GPU"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "meshio",
    "numpy",
    "scipy",
    "tqdm",
    "pyyaml",
    "openpyxl",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 200  # assembly.py tem formulas de elemento finito densas, quebrar linha piora a leitura
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
