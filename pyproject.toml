[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femns"
version = "0.1.0"
description = "Solver de elementos finitos (Galerkin) para Navier-Stokes em GPU"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "meshio",
    "numpy",
    "scipy",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
